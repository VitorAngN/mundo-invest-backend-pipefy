name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar site e documentação da API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exportar OpenAPI do FastAPI
        run: python scripts/exportar_openapi.py _site/api/openapi.json
      - name: Validar e renderizar a documentação (Redoc)
        run: |
          npx --yes @redocly/cli@latest lint _site/api/openapi.json --skip-rule=operation-operationId --skip-rule=info-license
          npx --yes @redocly/cli@latest build-docs _site/api/openapi.json -o _site/api/index.html --title "Gestão de Clientes + Pipefy — API"
      - run: cp site/index.html site/og.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
